# Local-only Postgres for `npm run local:dev`. Never used by Vercel.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: splitwiser
      POSTGRES_PASSWORD: splitwiser
      POSTGRES_DB: splitwiser
    ports:
      - "54330:5432"
    volumes:
      - splitwiser-local-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitwiser"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  splitwiser-local-db:
